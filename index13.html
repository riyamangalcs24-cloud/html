<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        * {
            margin:0px;
            padding:0px;
        }
        .container {
            height:80%;
            width:80%;
            border:1px solid black;
            background-color: blueviolet;
            margin:auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr,1fr,1fr;
        }
        .item {
            border:1px solid black;
            background-color: salmon;
            text-align: center;
        }
        .row {
            grid-column: 1/5;
        }
        .column {
            grid-column: 1/5;
        }



    </style>
</head>
<body>
    <div class="container">
        <div class="item row">box 1</div>
        <div class="item">box 2</div>
        <div class="item">box 3</div>
        <div class="item">box 4</div>
        <div class="item column">box 5</div>
    </div>
</body>
</html>
